<style>

<body>
<header>
 <b>电吉他模拟器</b>
 <button id="play">▶ 播放</button><button id="stop">■ 停止</button><button id="test">🔊 试听</button>

 <span class="label">技法</span><select id="phraseMode"><option value="natural" selected>自然</option><option value="singing">人声式</option><option value="pedal">踏板式</option><option value="tight">紧凑</option></select>
 <span class="label">混响</span><input id="reverb" type="range" min="0" max="30" step="1" value="12"><span class="value" id="reverbV">12%</span>
 <span class="label">延迟</span><input id="delay" type="range" min="0" max="20" step="1" value="5"><span class="value" id="delayV">5%</span><span class="label">总输出</span><input id="masterOut" type="range" min="80" max="145" step="1" value="112"><span class="value" id="masterOutV">112%</span>
 <button id="exportWav">混合导出 WAV</button>

   <span class="exportSpinner" aria-hidden="true"></span>

 </span>
 <span id="status" hidden>就绪</span>
 <span class="spacer"></span><button id="addGuitar" class="primary">＋ 添加主奏吉他</button>

<div class="modeTabs">

 <div class="strumCard">

  </div>

   顶部“播放”会与 Piano Roll 的 Guitar A / B 同步播放。

 </div>
</section>

<script src="samples.js"></script>
<script>
let TOTAL=256;const TIMELINE_CHUNK=128,TIMELINE_MARGIN=32,STEP_W=48,ROW_H=28,LABEL_W=66,RULER_H=25;
const pitches=["E5","D#5","D5","C#5","C5","B4","A#4","A4","G#4","G4","F#4","F4","E4","D#4","D4","C#4","C4","B3","A#3","A3","G#3","G3","F#3","F3","E3"];
const marks={normal:"",bend:"B",release:"BR",slide:"S",vib:"V",mute:"PM",hammer:"H",pull:"P",trem:"TR",harm:"NH",pinch:"PH",alt:"AP",sweep:"SW",tap:"T"};
const roots=[{m:37,n:"db2"},{m:40,n:"e2"},{m:42,n:"gb2"},{m:45,n:"a2"},{m:48,n:"c3"},{m:51,n:"eb3"},{m:54,n:"gb3"},{m:57,n:"a3"},{m:60,n:"c4"},{m:63,n:"eb4"},{m:66,n:"gb4"},{m:69,n:"a4"},{m:72,n:"c5"},{m:75,n:"eb5"},{m:78,n:"gb5"},{m:81,n:"a5"},{m:84,n:"c6"},{m:86,n:"d6"}];
const state={
 A:{notes:[],tech:"normal",preset:"summer",velocity:"smart",volume:.78,drive:1.08,stackOn:false,stackMix:.38,stackDrive:1.45,nextId:1,selected:null,scoreCursor:0,scoreKey:0,scoreLen:1},
 B:{notes:[],tech:"normal",preset:"double",velocity:"smart",volume:.73,drive:1.00,stackOn:false,stackMix:.34,stackDrive:1.35,nextId:1,selected:null,scoreCursor:0,scoreKey:0,scoreLen:1},
 C:{notes:[],tech:"normal",preset:"summer",velocity:"smart",volume:.74,drive:1.08,stackOn:false,stackMix:.34,stackDrive:1.35,nextId:1,selected:null},
 D:{notes:[],tech:"normal",preset:"double",velocity:"smart",volume:.70,drive:1.00,stackOn:false,stackMix:.30,stackDrive:1.30,nextId:1,selected:null}
};
const MAX_GUITAR_VOICES=6;
let trackCount=1,strumTrackCount=1,ctx=null,decoded=new Map(),session=null,uiTimers=[],playGeneration=0,previewSessions=new Set(),strumSession=null;

function ensureAudio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});if(ctx.state!=="running")ctx.resume().catch(()=>{});return ctx}
document.addEventListener("pointerdown",()=>{const a=ensureAudio();if(a.state!=="running")a.resume().catch(()=>{})},{capture:true});
function b64ToArrayBuffer(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function getBuffer(key,ac=ctx,cache=decoded){if(cache.has(key))return cache.get(key);const raw=EMBEDDED_SAMPLES[key];if(!raw)throw new Error("Missing sample "+key);const b=await ac.decodeAudioData(b64ToArrayBuffer(raw).slice(0));cache.set(key,b);return b}
function pitchToMidi(p){const n={"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};const m=p.match(/^([A-G]#?)(\d)$/);return 12*(+m[2]+1)+n[m[1]]}
function pitchText(p){return p}
function minSnap(){return +document.getElementById("snap").value||.125}
function refreshFineGrid(){const s=minSnap();document.querySelectorAll(".gridArea").forEach(g=>g.style.backgroundSize=(STEP_W*s)+"px "+ROW_H+"px")}
function nearestRoot(m){let b=roots[0];for(const r of roots)if(Math.abs(r.m-m)<Math.abs(b.m-m))b=r;return b}
function velLayer(v){if(v<.38)return"p";if(v<.60)return"mp";if(v<.82)return"mf";return"f"}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function snapValue(v){const s=+document.getElementById("snap").value||.25;return Math.round(v/s)*s}
function seed01(track,start,midi){const tm={A:83492791,B:1234567,C:4256249,D:741457}[track]||314159;let x=(Math.round(start*4)+1)*73856093^midi*19349663^tm;x>>>=0;return(x%1000)/999}
function velocityFor(track,n){if(n.hard)return .97;const m=state[track].velocity;if(m==="soft")return .38;if(m==="mid")return .63;if(m==="hard")return .91;return .52+seed01(track,n.start,n.midi)*.22}
function rrFor(track,n){const ti={A:0,B:1,C:2,D:3}[track]||0;return 1+((Math.round(n.start*4)+n.midi+ti)%3)}

function asymCurve(amount){
 const N=4096,c=new Float32Array(N),k=Math.max(.1,amount);
 const posNorm=Math.max(.0001,Math.tanh(k));
 const negNorm=Math.max(.0001,Math.tanh(k*.84));
 for(let i=0;i<N;i++){
   const x=i*2/(N-1)-1;
   c[i]=x>=0 ? Math.tanh(x*k)/posNorm : Math.tanh(x*k*.84)/negNorm;
 }
 return c;
}
function tone(name,v,d){
 if(name==="clean")return{pre:1.05,drive:(.65+v)*d,clean:.80,dirty:.22,hp:88,low:-1.4,mid:1,pres:2.8,air:1.6,lp:8100};
 if(name==="crunch")return{pre:1.35,drive:(1.65+v*4.2)*d,clean:.57,dirty:.55,hp:95,low:-2.3,mid:2.4,pres:3.4,air:1.2,lp:7200};
 if(name==="lead")return{pre:1.48,drive:(2.2+v*5.8)*d,clean:.42,dirty:.69,hp:100,low:-2.8,mid:2.8,pres:3.6,air:.9,lp:6500};
 if(name==="double")return{pre:1.30,drive:(1.5+v*4)*d,clean:.58,dirty:.55,hp:94,low:-2.4,mid:2.1,pres:3,air:1.15,lp:7100};
 return{pre:1.28,drive:(1.45+v*4.25)*d,clean:.62,dirty:.57,hp:92,low:-2.2,mid:2,pres:3.5,air:1.5,lp:7300};
}
function impulse(ac,duration=1.28,decay=4.8){
 const len=Math.floor(ac.sampleRate*duration),b=ac.createBuffer(2,len,ac.sampleRate);
 let seed=918273;
 const rnd=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
 for(let ch=0;ch<2;ch++){
   const d=b.getChannelData(ch);
   let smooth=0,slow=0;
   for(let i=0;i<len;i++){
     const n=rnd()*2-1;
     smooth=smooth*.83+n*.17;
     slow=slow*.965+n*.035;
     const t=i/len,env=Math.exp(-decay*t);
     const early=i<ac.sampleRate*.055 ? .58 : 1;
     d[i]=(smooth*.78+slow*.22)*env*early*.50;
   }
   // A few controlled early reflections instead of raw white-noise spikes.
   const taps=[.021,.034,.049,.071];
   for(let k=0;k<taps.length;k++){
     const idx=Math.floor(taps[k]*ac.sampleRate);
     if(idx<len)d[idx]+=([.24,-.18,.14,-.10][k])*(ch===0?1:.94);
   }
 }
 return b;
}
function masterSoftClipCurve(){
 const N=4096,c=new Float32Array(N),k=1.18,norm=Math.tanh(k);
 for(let i=0;i<N;i++){
   const x=i*2/(N-1)-1;
   c[i]=Math.tanh(x*k)/norm;
 }
 return c;
}

function makeMaster(ac,dest,bpm,rvPct,dlPct){
 const dry=ac.createGain(),rvIn=ac.createGain(),dlIn=ac.createGain(),sum=ac.createGain();
 dry.connect(sum);

 const pred=ac.createDelay(.2),conv=ac.createConvolver(),rhp=ac.createBiquadFilter(),rlp=ac.createBiquadFilter(),rg=ac.createGain();
 pred.delayTime.value=.014;
 conv.buffer=impulse(ac);
 rhp.type="highpass";rhp.frequency.value=185;
 rlp.type="lowpass";rlp.frequency.value=7000;
 rg.gain.value=rvPct/100*.58;
 rvIn.connect(pred).connect(conv).connect(rhp).connect(rlp).connect(rg).connect(sum);

 const dL=ac.createDelay(.8),dR=ac.createDelay(.8),fL=ac.createBiquadFilter(),fR=ac.createBiquadFilter(),pL=ac.createStereoPanner(),pR=ac.createStereoPanner(),dg=ac.createGain();
 dL.delayTime.value=Math.min(.65,60/bpm*.375);
 dR.delayTime.value=Math.min(.65,60/bpm*.5);
 fL.type=fR.type="lowpass";fL.frequency.value=5000;fR.frequency.value=4700;
 pL.pan.value=-.45;pR.pan.value=.45;
 dg.gain.value=dlPct/100*.54;
 dlIn.connect(dL).connect(fL).connect(pL).connect(dg).connect(sum);
 dlIn.connect(dR).connect(fR).connect(pR).connect(dg).connect(sum);

 const dc=ac.createBiquadFilter(),busComp=ac.createDynamicsCompressor(),lim=ac.createDynamicsCompressor(),clip=ac.createWaveShaper(),sessionGain=ac.createGain();
 dc.type="highpass";dc.frequency.value=24;dc.Q.value=.55;

 busComp.threshold.value=-8;
 busComp.knee.value=14;
 busComp.ratio.value=1.45;
 busComp.attack.value=.014;
 busComp.release.value=.16;

 lim.threshold.value=-1.0;
 lim.knee.value=.5;
 lim.ratio.value=20;
 lim.attack.value=.001;
 lim.release.value=.055;

 clip.curve=masterSoftClipCurve();
 clip.oversample="4x";

 const masterPct=+(document.getElementById("masterOut")?.value||112);
 sessionGain.gain.value=masterPct/100;

 sum.connect(dc).connect(busComp).connect(lim).connect(clip).connect(sessionGain).connect(dest);
 return{dry,rvIn,dlIn,sessionGain}
}
function makeGuitarBus(ac,track,master){
 const s=state[track],p=tone(s.preset,.68,s.drive);
 const input=ac.createGain(),ic=ac.createDynamicsCompressor(),hp=ac.createBiquadFilter(),low=ac.createBiquadFilter();

 ic.threshold.value=-12;
 ic.knee.value=12;
 ic.ratio.value=2.25;
 ic.attack.value=.0035;
 ic.release.value=.095;

 hp.type="highpass";hp.frequency.value=p.hp;
 low.type="lowshelf";low.frequency.value=230;low.gain.value=p.low;
 input.connect(ic).connect(hp).connect(low);

 // 清亮 branch: bright transient.
 const ce=ac.createBiquadFilter(),air=ac.createBiquadFilter(),cg=ac.createGain();
 ce.type="peaking";ce.frequency.value=3400;ce.Q.value=.75;ce.gain.value=p.pres;
 air.type="highshelf";air.frequency.value=5200;air.gain.value=p.air;
 cg.gain.value=p.clean;
 low.connect(ce).connect(air).connect(cg);

 // Base drive branch: one shared amp per guitar.
 const pre=ac.createGain(),pm=ac.createBiquadFilter(),sh=ac.createWaveShaper(),driveDC=ac.createBiquadFilter();
 const mid=ac.createBiquadFilter(),cab=ac.createBiquadFilter(),dg=ac.createGain();
 pre.gain.value=p.pre*1.05;
 pm.type="peaking";pm.frequency.value=1180;pm.Q.value=.72;pm.gain.value=3.0;
 sh.curve=asymCurve(p.drive);sh.oversample="4x";
 driveDC.type="highpass";driveDC.frequency.value=28;driveDC.Q.value=.60;
 mid.type="peaking";mid.frequency.value=1850;mid.Q.value=.78;mid.gain.value=p.mid;
 cab.type="lowpass";cab.frequency.value=p.lp;cab.Q.value=.68;
 dg.gain.value=p.dirty;
 low.connect(pre).connect(pm).connect(sh).connect(driveDC).connect(mid).connect(cab).connect(dg);

 // Optional second stack stage, still one per guitar.
 const xPre=ac.createGain(),xEQ=ac.createBiquadFilter(),xShape=ac.createWaveShaper(),xDC=ac.createBiquadFilter(),xCab=ac.createBiquadFilter(),xGain=ac.createGain();
 xPre.gain.value=1.08+s.stackDrive*.52;
 xEQ.type="peaking";xEQ.frequency.value=1450;xEQ.Q.value=.78;xEQ.gain.value=2.4;
 xShape.curve=asymCurve((p.drive*.96)*(1+s.stackDrive*.88));xShape.oversample="4x";
 xDC.type="highpass";xDC.frequency.value=32;xDC.Q.value=.60;
 xCab.type="lowpass";xCab.frequency.value=5900;xCab.Q.value=.72;
 xGain.gain.value=s.stackOn?s.stackMix*1.12:0;
 cab.connect(xPre).connect(xEQ).connect(xShape).connect(xDC).connect(xCab).connect(xGain);

 const sum=ac.createGain(),post=ac.createBiquadFilter(),trackComp=ac.createDynamicsCompressor(),out=ac.createGain(),pan=ac.createStereoPanner();
 cg.connect(sum);dg.connect(sum);xGain.connect(sum);

 post.type="peaking";post.frequency.value=4200;post.Q.value=.85;post.gain.value=.65;

 trackComp.threshold.value=-7;
 trackComp.knee.value=12;
 trackComp.ratio.value=1.7;
 trackComp.attack.value=.006;
 trackComp.release.value=.10;

 out.gain.value=s.volume*(s.stackOn?.96:1);
 pan.pan.value=({A:-.16,B:.16,C:-.46,D:.46}[track]??0);

 sum.connect(post).connect(trackComp).connect(out).connect(pan);
 pan.connect(master.dry);

 const rv=ac.createGain(),dl=ac.createGain();
 rv.gain.value=.74;
 dl.gain.value=.62;
 pan.connect(rv).connect(master.rvIn);
 pan.connect(dl).connect(master.dlIn);

 return{input,track};
}

const GUITAR_KB={
 tuning:[40,45,50,55,59,64], // strings 6 -> 1
 maxFret:24,
 legatoMax:5,
 slideMin:3,
 slideMax:8,
 bendSemitones:[1,2],
 vibratoRate:5.4,
 vibratoDepth:22,
 sweepGapSteps:1.25,
 tappingWideInterval:7
};

function playablePositions(midi){
 const out=[];
 for(let s=0;s<6;s++){
   const fret=midi-GUITAR_KB.tuning[s];
   if(fret>=0&&fret<=GUITAR_KB.maxFret)out.push({string:6-s,fret,idx:s});
 }
 return out;
}

function assignFingering(track){
 const notes=[...state[track].notes].sort((a,b)=>a.start-b.start||a.midi-b.midi);
 let prev=null;
 for(let i=0;i<notes.length;){
   const st=notes[i].start,group=[];
   while(i<notes.length&&Math.abs(notes[i].start-st)<.0001)group.push(notes[i++]);
   const used=new Set();
   group.sort((a,b)=>a.midi-b.midi);
   for(const n of group){
     const cands=playablePositions(n.midi).filter(c=>!used.has(c.string));
     const pool=cands.length?cands:playablePositions(n.midi);
     let best=pool[0]||{string:1,fret:0,idx:5},score=1e9;
     for(const c of pool){
       let cost=Math.abs(c.fret-9)*.06;
       if(prev){
         cost+=Math.abs(c.fret-prev.fret)*.42+Math.abs(c.string-prev.string)*.78;
         if(c.string===prev.string)cost-=.45;
       }
       if(c.fret>19)cost+=(c.fret-19)*.18;
       if(cost<score){score=cost;best=c}
     }
     n.string=best.string;n.fret=best.fret;used.add(best.string);prev=best;
   }
 }
 return notes;
}

function phraseGroups(notes){
 const groups=[];let cur=[];
 for(const n of notes){
   if(!cur.length){cur=[n];continue}
   const p=cur[cur.length-1];
   const gap=n.start-(p.start+p.length);
   if(n.start-p.start<=2.0 && gap<=.75)cur.push(n);
   else{groups.push(cur);cur=[n]}
 }
 if(cur.length)groups.push(cur);
 return groups;
}

function applyPerformance(track,mode="auto"){
 const notes=assignFingering(track);
 for(const n of notes){n.tech="normal";n.pickDir=null}
 const phrases=phraseGroups(notes);

 for(const ph of phrases){
   const mono=ph.every((n,i)=>i===0||n.start>ph[i-1].start+.0001);
   const avgLen=ph.reduce((s,n)=>s+n.length,0)/Math.max(1,ph.length);

   // Alternate picking on fast monophonic runs.
   if(mono&&ph.length>=4&&avgLen<=1.05){
     let dir=1;
     for(const n of ph){n.tech="alt";n.pickDir=dir;dir*=-1}
   }

   // Same-string legato and slides.
   if(mono){
     for(let i=1;i<ph.length;i++){
       const a=ph[i-1],b=ph[i],intv=b.midi-a.midi,dist=Math.abs(intv);
       const close=b.start-(a.start+a.length)<=.35;
       if(a.string===b.string&&close){
         if(dist>=1&&dist<=GUITAR_KB.legatoMax){
           b.tech=intv>0?"hammer":"pull";
         }else if(dist>=GUITAR_KB.slideMin&&dist<=GUITAR_KB.slideMax){
           b.tech="slide";
         }
       }
     }
   }

   // Sweep-like arpeggio: monotonic string movement across >=4 notes.
   if(ph.length>=4&&avgLen<=1.25){
     const dirs=[];
     for(let i=1;i<ph.length;i++)dirs.push(Math.sign((ph[i].string||0)-(ph[i-1].string||0)));
     const nz=dirs.filter(x=>x!==0);
     if(nz.length>=3&&nz.every(x=>x===nz[0])){
       for(const n of ph)n.tech="sweep";
     }
   }

   if(mode==="shred"){
     // Wide fast leaps are good tapping candidates.
     for(let i=1;i<ph.length;i++){
       const a=ph[i-1],b=ph[i],dist=Math.abs(b.midi-a.midi);
       if(dist>=GUITAR_KB.tappingWideInterval && b.start-a.start<=1.25)b.tech="tap";
     }
     // Repeated sustained pitch -> tremolo picking.
     for(let i=1;i<ph.length;i++){
       const a=ph[i-1],b=ph[i];
       if(a.midi===b.midi&&b.start-a.start<=1.0){a.tech="trem";b.tech="trem"}
     }
     // High phrase ending: expressive bend/pinch/vibrato.
     const last=ph[ph.length-1];
     if(last){
       const peak=Math.max(...ph.map(n=>n.midi));
       if(last.length>=1.5&&last.midi>=peak-1)last.tech=(last.midi>=76?"pinch":"vib");
     }
     // Long note followed by 1-2 semitone target -> bend into it.
     for(let i=0;i<ph.length-1;i++){
       const a=ph[i],b=ph[i+1],d=b.midi-a.midi;
       if(a.length>=1.25&&GUITAR_KB.bendSemitones.includes(d)&&a.string===b.string)a.tech="bend";
     }
   }else{
     const last=ph[ph.length-1];
     if(last&&last.length>=2&&last.tech==="normal")last.tech="vib";
   }
 }
 renderNotes(track);
}
function modeSettings(){const m=document.getElementById("phraseMode").value;if(m==="tight")return{join:.006,release:.026,legato:3};if(m==="singing")return{join:.034,release:.070,legato:8};if(m==="pedal")return{join:.020,release:.085,legato:7};return{join:.018,release:.052,legato:5}}
function buildPlan(){
 const bpm=clamp(+document.getElementById("bpm").value||150,60,220),stepSec=60/bpm/4,set=modeSettings();let events=[];
 for(const track of(trackCount===2?["A","B"]:["A"])){
   const notes=[...state[track].notes].sort((a,b)=>a.start-b.start||a.midi-b.midi);
   for(let i=0;i<notes.length;i++){
     const n=notes[i],start=n.start*stepSec,baseDur=Math.max(.025,n.length*stepSec);let next=null;
     for(let j=i+1;j<notes.length;j++)if(notes[j].start>n.start+.0001){next=notes[j];break}
     let gate=baseDur,legatoOut=false;
     if(next){
       const nt=next.start*stepSec,interval=Math.abs(next.midi-n.midi),explicit=start+baseDur>nt+.001,close=Math.abs(start+baseDur-nt)<=stepSec*.55;
       const mono=notes.filter(q=>Math.abs(q.start-next.start)<.001).length===1;
       if(n.midi===next.midi&&Math.abs(start+baseDur-nt)<stepSec*.75)gate=Math.min(gate,Math.max(.025,nt-start-.008));
       else if(mono&&interval<=set.legato&&(close||explicit)){legatoOut=true;gate=explicit?Math.min(baseDur,nt-start+set.join):Math.max(baseDur,nt-start+set.join)}
     }
     if(n.tech==="mute")gate=Math.min(gate,.115);if(n.tech==="trem")gate=Math.min(gate,.145);
     const baseEvent={track,start,midi:n.midi,tech:n.tech,velocity:velocityFor(track,n),rr:rrFor(track,n),gate,release:Math.min(set.release,Math.max(.012,gate*.42)),legatoOut,noteId:n.id,string:n.string||null,fret:n.fret??null,pickDir:n.pickDir||null};
     if(n.tech==="trem"){
       const sub=Math.max(.035,stepSec*.5),count=Math.max(1,Math.floor(baseDur/sub));
       for(let k=0;k<count;k++)events.push({...baseEvent,start:start+k*sub,gate:Math.min(sub*.78,.085),release:.012,rr:1+((rrFor(track,n)+k-1)%3),pickDir:k%2? -1:1});
     }else events.push(baseEvent);
   }
 }
 events.sort((a,b)=>a.start-b.start);
 for(let i=0;i<events.length;){
   let j=i+1;while(j<events.length&&Math.abs(events[j].start-events[i].start)<.0001)j++;
   const g=events.slice(i,j);
   if(g.length>1&&g.some(x=>x.tech==="sweep")){
     g.sort((a,b)=>(b.string||0)-(a.string||0));
     for(let k=0;k<g.length;k++)g[k].start+=k*.012;
   }
   i=j;
 }
 events.sort((a,b)=>a.start-b.start);
 for(let i=0;i<events.length;i++){events[i].legatoIn=false;for(let j=i-1;j>=0;j--){const p=events[j],e=events[i];if(p.track!==e.track)continue;if(p.start<e.start-.0001){if(p.legatoOut&&Math.abs(p.start+p.gate-e.start)<.09)e.legatoIn=true;break}}}
 events=stabilizeGuitarVoices(events);return{bpm,events}
}
function stabilizeGuitarVoices(events){
 for(const track of ["A","B","C","D"]){
   const list=events.filter(e=>e.track===track).sort((a,b)=>a.start-b.start||b.velocity-a.velocity);
   const active=[];

   for(const e of list){
     for(let i=active.length-1;i>=0;i--){
       if(active[i].start+active[i].gate<=e.start+.001)active.splice(i,1);
     }

     // Six physical strings: a 7th overlapping voice steals the oldest tail.
     while(active.length>=MAX_GUITAR_VOICES){
       const victim=active.shift();
       const shortened=Math.max(.025,e.start-victim.start-.006);
       victim.gate=Math.min(victim.gate,shortened);
       victim.release=Math.min(victim.release,.018);
     }

     const voices=active.length+1;
     e.polyGain=1/(1+.075*(voices-1));
     active.push(e);
   }
 }
 return events;
}

async function scheduleEvent(ac,e,buses,cache,base=0,sourceSet=null){
 const r=nearestRoot(e.midi),key=r.n+"_"+velLayer(e.velocity)+"_rr"+e.rr;
 const buf=await getBuffer(key,ac,cache),src=ac.createBufferSource(),env=ac.createGain(),voice=ac.createGain(),st=base+e.start;

 src.buffer=buf;
 src.playbackRate.value=Math.pow(2,(e.midi-r.m)/12);
 src.detune.setValueAtTime(0,st);

 if(e.tech==="bend")src.detune.linearRampToValueAtTime(200,st+Math.min(.20,e.gate*.65));
 if(e.tech==="release"){src.detune.setValueAtTime(200,st);src.detune.linearRampToValueAtTime(0,st+Math.min(.20,e.gate*.65))}
 if(e.tech==="slide"){src.detune.setValueAtTime(-300,st);src.detune.linearRampToValueAtTime(0,st+Math.min(.12,e.gate*.55))}
 if(e.tech==="harm"||e.tech==="pinch")src.detune.value+=1200;
 if(e.tech==="tap"){src.detune.setValueAtTime(-22,st);src.detune.linearRampToValueAtTime(0,st+.022)}

 const atk=e.legatoIn?.018:.0035;
 let target=1;
 if(e.tech==="hammer"||e.tech==="pull")target*=.88;
 if(e.tech==="slide")target*=.94;
 if(e.tech==="tap")target*=.90;
 if(e.tech==="sweep")target*=.96;

 env.gain.setValueAtTime(.0001,st);
 if(e.legatoIn){
   env.gain.linearRampToValueAtTime(target*.42,st+.006);
   env.gain.linearRampToValueAtTime(target,st+atk);
 }else{
   env.gain.linearRampToValueAtTime(target,st+atk);
 }
 const fs=Math.max(st+atk+.001,st+e.gate-e.release);
 env.gain.setValueAtTime(target,fs);
 env.gain.exponentialRampToValueAtTime(.0001,st+e.gate);

 if(e.tech==="vib"){
   const lfo=ac.createOscillator(),lg=ac.createGain();
   lfo.frequency.value=5.4;lg.gain.value=14;
   lfo.connect(lg).connect(src.detune);
   lfo.start(st+.06);lfo.stop(st+e.gate);
 }

 const pg=e.polyGain||1;
 voice.gain.value=(.70+e.velocity*.34)*pg;
 if(e.tech==="mute")voice.gain.value*=.82;
 if(e.tech==="hammer"||e.tech==="pull")voice.gain.value*=.88;
 if(e.tech==="tap")voice.gain.value*=.91;
 if(e.tech==="alt"&&e.pickDir<0)voice.gain.value*=.94;
 if(e.tech==="sweep")voice.gain.value*=.96;

 src.connect(env).connect(voice).connect(buses[e.track].input);
 src.start(st);
 src.stop(st+e.gate+.04);

 if(sourceSet){
   sourceSet.add(src);
   src.onended=()=>sourceSet.delete(src);
 }
}
function cleanupSession(target,fade=true){
 if(!target)return;

 // Stop every source scheduled by this session.
 for(const s of [...target.sources]){
   try{s.onended=null;s.stop()}catch(e){}
 }
 target.sources.clear();

 // Stop UI timers owned by this session.
 if(target.timer){clearTimeout(target.timer);target.timer=null}
 if(target.uiTimers){
   for(const t of target.uiTimers)clearTimeout(t);
   target.uiTimers.length=0;
 }

 // Fade and disconnect the whole master graph.
 try{
   const now=ctx.currentTime;
   target.master.sessionGain.gain.cancelScheduledValues(now);
   target.master.sessionGain.gain.setValueAtTime(
     Math.max(.0001,target.master.sessionGain.gain.value),now
   );
   if(fade){
     target.master.sessionGain.gain.linearRampToValueAtTime(.0001,now+.025);
   }else{
     target.master.sessionGain.gain.setValueAtTime(.0001,now);
   }
 }catch(e){}

 setTimeout(()=>{
   try{target.master.sessionGain.disconnect()}catch(e){}
   try{target.master.dry.disconnect()}catch(e){}
   try{target.master.rvIn.disconnect()}catch(e){}
   try{target.master.dlIn.disconnect()}catch(e){}
   if(target.buses){
     for(const b of Object.values(target.buses)){
       try{b.input.disconnect()}catch(e){}
     }
   }
 },fade?60:5);
}

function resetPlayerUI(message="已停止"){
 document.getElementById("play").disabled=false;
 document.getElementById("exportWav").disabled=false;
 document.querySelectorAll(".note.playing").forEach(x=>x.classList.remove("playing"));
 document.getElementById("status").textContent=message;
 document.getElementById("status").className="badge warn";
}

function stopPlayback(){
 playGeneration++;
 const old=session;
 session=null;
 cleanupSession(old,true);
 resetPlayerUI("已停止");
}

async function playOnce(){
 if(strumSession)stopStrumPlayback();
 if(session){cleanupSession(session,false);session=null}
 ensureAudio();
 const generation=++playGeneration,plan=buildCombinedPlan();
 if(!plan.events.length){resetPlayerUI("先写音符或扫弦");return}

 document.getElementById("play").disabled=true;
 document.getElementById("exportWav").disabled=true;
 document.getElementById("status").textContent="准备音源…";
 try{
   const keys=[...new Set(plan.events.map(e=>{const r=nearestRoot(e.midi);return r.n+"_"+velLayer(e.velocity)+"_rr"+e.rr}))];
   await Promise.all(keys.map(k=>getBuffer(k)));
   if(generation!==playGeneration){resetPlayerUI("已停止");return}

   const master=makeMaster(ctx,ctx.destination,plan.bpm,+document.getElementById("reverb").value||0,+document.getElementById("delay").value||0);
   const buses={};for(const t of activeTracks(plan.events))buses[t]=makeGuitarBus(ctx,t,master);
   const sources=new Set(),ownedUiTimers=[],base=ctx.currentTime+.065;
   const current={id:generation,master,buses,sources,timer:null,uiTimers:ownedUiTimers};session=current;
   for(const e of plan.events)await scheduleEvent(ctx,e,buses,decoded,base,sources);
   if(generation!==playGeneration||session!==current){cleanupSession(current,false);return}

   document.getElementById("status").textContent="播放中";
   for(const e of plan.events){
     if(!e.noteId)continue;
     ownedUiTimers.push(setTimeout(()=>{
       if(session!==current)return;
       const el=document.querySelector(`.track[data-track="${e.track}"] .note[data-id="${e.noteId}"]`);
       if(el){el.classList.add("playing");const off=setTimeout(()=>el.classList.remove("playing"),Math.max(30,e.gate*1000));ownedUiTimers.push(off)}
     },Math.max(0,(e.start+.065)*1000)));
   }
   const last=Math.max(...plan.events.map(e=>e.start+e.gate));
   current.timer=setTimeout(()=>{
     if(session!==current||generation!==playGeneration)return;
     session=null;
     try{const now=ctx.currentTime;current.master.sessionGain.gain.setValueAtTime(Math.max(.0001,current.master.sessionGain.gain.value),now);current.master.sessionGain.gain.linearRampToValueAtTime(.0001,now+.38)}catch(e){}
     setTimeout(()=>cleanupSession(current,false),430);
     resetPlayerUI("播放完成");
   },(last+.10)*1000);
 }catch(err){
   console.error(err);const failed=session;session=null;cleanupSession(failed,false);resetPlayerUI("播放失败");
 }
}

const SCORE_SCALE=[0,2,4,5,7,9,11];
function scoreMidi(track,degree,octShift){
 const tonic=state[track].scoreKey||0;
 return 60+tonic+SCORE_SCALE[degree]+12*octShift;
}
function scorePitchIndex(midi){return pitches.findIndex(p=>pitchToMidi(p)===midi)}
function scoreRowHTML(track,octShift,label){
 const cls=octShift>0?"high":(octShift<0?"low":"mid");
 let out=`<div class="scoreRow"><div class="scoreRowLabel">${label}</div>`;
 for(let d=0;d<7;d++){
   const midi=scoreMidi(track,d,octShift),disabled=scorePitchIndex(midi)<0?"disabled":"";
   const dot=octShift===0?"":'<span class="octDot">•</span>';
   out+=`<button class="scoreDegree ${cls}" data-degree="${d}" data-oct="${octShift}" ${disabled}>${dot}<span>${d+1}</span></button>`;
 }
 out+='<div></div></div>';
 return out;
}
function wireScoreDegreeButtons(track,sec){

   const d=+b.dataset.degree,o=+b.dataset.oct,midi=scoreMidi(track,d,o),pi=scorePitchIndex(midi);
   if(pi<0)return;
   const len=state[track].scoreLen||1,start=state[track].scoreCursor||0;
   extendTimelineTo(start+len+TIMELINE_MARGIN);
   const n={id:state[track].nextId++,pitchIndex:pi,midi,start,length:len,tech:state[track].tech,hard:false};

function beginMoveOrResize(t,sec,id,e,mode){

function buildStrumEventsFor(track){

     const cell=bar.steps[si];if(!cell.type)continue;

     let order=[...voicing];
     if(cell.type==="up")order=order.slice(Math.max(0,order.length-4)).reverse();
     const baseVelocity=cell.accent?.94:(cell.type==="up"?.67:.79);
     const perString=ss.spread/1000,localSustain=ss.sustain/1000,human=ss.human/100;
     order.forEach((q,k)=>{
       const jitter=(strumHash((track.charCodeAt(0)+1)*997+(bi+1)*131+(si+1)*89+(k+1)*31+seq)-.5)*.006*human;
       const start=Math.max(0,base+k*perString+jitter);
       let velocity=baseVelocity;
       if(cell.type==="down")velocity-=k*.025;
       if(cell.type==="up")velocity-=k*.018;
       velocity+=(strumHash(seq*53+track.charCodeAt(0))- .5)*.08*human;
       velocity=clamp(velocity,.34,.98);
       let gate=Math.max(.045,localSustain+k*.008+(strumHash(seq*71+9)-.5)*.035*human);
       if(cell.type==="mute"){gate=.065+k*.004+(strumHash(seq*23+11)-.5)*.018*human;velocity*=.78}
       events.push({
         track,start,midi:q.midi,tech:cell.type==="mute"?"mute":"normal",velocity,
         rr:1+((bi+si+k+(track==="D"?1:0))%3),gate,release:cell.type==="mute"?.014:.045,
         legatoIn:false,legatoOut:false,noteId:null,string:q.string,fret:null,
         pickDir:cell.type==="up"?-1:1,polyGain:1
       });seq++;
     });
   }
 }
 return events;
}
function buildStrumPlan(){
 const bpm=clamp(+document.getElementById("bpm").value||150,60,220);
 let events=buildStrumEventsFor("C");
 if(strumTrackCount===2)events=events.concat(buildStrumEventsFor("D"));
 events.sort((a,b)=>a.start-b.start);stabilizeGuitarVoices(events);
 return{bpm,events};
}
function buildCombinedPlan(){
 const lead=buildPlan(),strum=buildStrumPlan();
 const events=[...lead.events,...strum.events].sort((a,b)=>a.start-b.start);
 stabilizeGuitarVoices(events);
 return{bpm:lead.bpm,events};
}
function planForExport(mode){
 if(mode==="mix")return buildCombinedPlan();
 if(mode==="A"||mode==="B"){
   const p=buildPlan();return{bpm:p.bpm,events:p.events.filter(e=>e.track===mode)};
 }
 const p=buildStrumPlan();return{bpm:p.bpm,events:p.events.filter(e=>e.track===mode)};
}
function activeTracks(events){return[...new Set(events.map(e=>e.track))]}

function stopStrumPlayback(){
 if(!strumSession)return;const old=strumSession;strumSession=null;cleanupSession(old,true);
 const st=document.getElementById("strumStatus");if(st){st.textContent="已停止";st.className="badge warn"}
}
async function playStrum(){
 stopStrumPlayback();if(session)stopPlayback();ensureAudio();
 const plan=buildStrumPlan(),status=document.getElementById("strumStatus");
 if(!plan.events.length){status.textContent="先写扫弦";return}
 status.textContent="准备中…";status.className="badge ok";
 try{
   const keys=[...new Set(plan.events.map(e=>{const r=nearestRoot(e.midi);return r.n+"_"+velLayer(e.velocity)+"_rr"+e.rr}))];
   await Promise.all(keys.map(k=>getBuffer(k)));
   const master=makeMaster(ctx,ctx.destination,plan.bpm,+document.getElementById("reverb").value||0,+document.getElementById("delay").value||0);
   const buses={};for(const t of activeTracks(plan.events))buses[t]=makeGuitarBus(ctx,t,master);
   const sources=new Set(),current={master,buses,sources,timer:null,uiTimers:[]};strumSession=current;
   const base=ctx.currentTime+.06;
   for(const e of plan.events)await scheduleEvent(ctx,e,buses,decoded,base,sources);
   status.textContent="扫弦中";
   const last=Math.max(...plan.events.map(e=>e.start+e.gate));
   current.timer=setTimeout(()=>{
     if(strumSession!==current)return;strumSession=null;
     try{const now=ctx.currentTime;master.sessionGain.gain.setValueAtTime(Math.max(.0001,master.sessionGain.gain.value),now);master.sessionGain.gain.linearRampToValueAtTime(.0001,now+.34)}catch(e){}
     setTimeout(()=>cleanupSession(current,false),390);status.textContent="就绪";status.className="badge warn";
   },(last+.08)*1000);
 }catch(err){console.error(err);stopStrumPlayback();status.textContent="播放失败"}
}

function writeWavHeader(view,channels,rate,length){
 const blockAlign=channels*2,dataSize=length*blockAlign;
 const str=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i))};
 str(0,"RIFF");view.setUint32(4,36+dataSize,true);str(8,"WAVE");str(12,"fmt ");
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);
 view.setUint32(24,rate,true);view.setUint32(28,rate*blockAlign,true);
 view.setUint16(32,blockAlign,true);view.setUint16(34,16,true);
 str(36,"data");view.setUint32(40,dataSize,true);
 return{blockAlign,dataSize};
}
async function audioBufferToWavAsync(buffer,onProgress){
 const channels=buffer.numberOfChannels,rate=buffer.sampleRate,length=buffer.length;
 let peak=0;
 const scanChunk=65536;
 for(let base=0;base<length;base+=scanChunk){
   const end=Math.min(length,base+scanChunk);
   for(let c=0;c<channels;c++){
     const d=buffer.getChannelData(c);
     for(let i=base;i<end;i++)peak=Math.max(peak,Math.abs(d[i]));
   }
   if(onProgress)onProgress(.82+.05*(end/length),"编码 WAV");
   await new Promise(r=>requestAnimationFrame(r));
 }
 const scale=peak>.98?.98/peak:1,blockAlign=channels*2,dataSize=length*blockAlign;
 const ab=new ArrayBuffer(44+dataSize),view=new DataView(ab);
 writeWavHeader(view,channels,rate,length);
 let off=44;
 const encChunk=32768;
 for(let base=0;base<length;base+=encChunk){
   const end=Math.min(length,base+encChunk);
   for(let i=base;i<end;i++){
     for(let c=0;c<channels;c++){
       let x=clamp(buffer.getChannelData(c)[i]*scale,-1,1);
       view.setInt16(off,x<0?x*32768:x*32767,true);
       off+=2;
     }
   }
   if(onProgress)onProgress(.87+.13*(end/length),"编码 WAV");
   await new Promise(r=>requestAnimationFrame(r));
 }
 return new Blob([ab],{type:"audio/wav"});
}
function exportEstimate(plan){
 if(!plan.events.length)return 1;
 const duration=Math.max(...plan.events.map(e=>e.start+e.gate))+1.75;
 const tracks=activeTracks(plan.events).length;
 const uniqueSamples=new Set(plan.events.map(e=>{
   const r=nearestRoot(e.midi);
   return r.n+"_"+velLayer(e.velocity)+"_rr"+e.rr;
 })).size;
 // Empirical UI estimate, intentionally conservative because browser/CPU speed differs.
 return Math.max(1,Math.ceil(.8+duration*(.028+.012*tracks)+plan.events.length*.002+uniqueSamples*.006));
}
function triggerWavDownload(blob,filename){
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1200);
}
let exportBusy=false;
async function renderWavPlan(plan,filename,options={}){
 if(exportBusy)throw new Error("EXPORT_BUSY");
 if(session||strumSession)throw new Error("PLAYBACK_ACTIVE");
 if(!plan.events.length)throw new Error("EMPTY_TRACK");

 ensureAudio();
 exportBusy=true;

 const started=performance.now();
 const eta=exportEstimate(plan);
 const progressEl=options.progressEl||null;
 const textEl=options.textEl||null;
 const button=options.button||null;
 let timer=null;

 if(button){button.disabled=true;button.classList.add("exportMiniBusy")}
 if(progressEl)progressEl.hidden=false;

 const refreshText=(stage="离线混音")=>{
   if(!textEl)return;
   const elapsed=Math.max(0,(performance.now()-started)/1000);
   if(elapsed<=eta+1){
     textEl.textContent=`${stage}｜预计约 ${eta} 秒｜已用 ${elapsed.toFixed(1)} 秒`;
   }else{
     textEl.textContent=`${stage}｜已用 ${elapsed.toFixed(1)} 秒`;
   }
 };
 refreshText();
 timer=setInterval(()=>refreshText(textEl?.dataset.stage||"离线混音"),250);

 try{
   const last=Math.max(...plan.events.map(e=>e.start+e.gate)),sr=44100;
   const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
   if(!OAC)throw new Error("OFFLINE_AUDIO_UNSUPPORTED");
   const off=new OAC(2,Math.ceil((last+1.75)*sr),sr),cache=new Map();

   const master=makeMaster(
     off,off.destination,plan.bpm,
     +document.getElementById("reverb").value||0,
     +document.getElementById("delay").value||0
   );
   const buses={};
   for(const t of activeTracks(plan.events))buses[t]=makeGuitarBus(off,t,master);

   const keys=[...new Set(plan.events.map(e=>{
     const r=nearestRoot(e.midi);
     return r.n+"_"+velLayer(e.velocity)+"_rr"+e.rr;
   }))];

   if(textEl)textEl.dataset.stage="准备音源";
   refreshText("准备音源");
   await Promise.all(keys.map(k=>getBuffer(k,off,cache)));

   if(textEl)textEl.dataset.stage="离线混音";
   refreshText("离线混音");
   for(const e of plan.events)await scheduleEvent(off,e,buses,cache,.04,null);

   const rendered=await off.startRendering();

   if(textEl)textEl.dataset.stage="编码 WAV";
   refreshText("编码 WAV");
   const blob=await audioBufferToWavAsync(rendered,(p,stage)=>{
     if(textEl)textEl.dataset.stage=stage;
     refreshText(stage);
   });

   triggerWavDownload(blob,filename);
   if(textEl)textEl.textContent=`完成｜${filename}`;
   return true;
 }finally{
   if(timer)clearInterval(timer);
   exportBusy=false;
   if(button){button.disabled=false;button.classList.remove("exportMiniBusy")}
   if(progressEl){
     // Keep "完成" visible briefly, then hide the spinner/status.
     setTimeout(()=>{progressEl.hidden=true},1100);
   }
 }
}
async function exportTrackWav(track,button){
 const plan=planForExport(track);
 const original=button?.textContent||"导出 WAV";
 if(!plan.events.length){
   if(button){
     button.textContent="无内容";
     setTimeout(()=>button.textContent=original,900);
   }
   return;
 }
 try{
   if(button)button.textContent="导出中…";
   await renderWavPlan(plan,`EG_${track}.wav`,{button});
   if(button)button.textContent="已导出";
 }catch(err){
   console.error(err);
   if(button)button.textContent=err.message==="PLAYBACK_ACTIVE"?"请先停止播放":"导出失败";
 }finally{
   if(button)setTimeout(()=>button.textContent=original,1100);
 }
}
async function exportWav(){
 const plan=planForExport("mix");
 const btn=document.getElementById("exportWav");
 const progress=document.getElementById("mixExportProgress");
 const text=document.getElementById("mixExportText");

 if(!plan.events.length){
   text.textContent="没有可导出的内容";
   progress.hidden=false;
   setTimeout(()=>progress.hidden=true,1200);
   return;
 }
 try{
   await renderWavPlan(plan,"EG.wav",{button:btn,progressEl:progress,textEl:text});
 }catch(err){
   console.error(err);
   progress.hidden=false;
   if(err.message==="PLAYBACK_ACTIVE")text.textContent="请先停止播放";
   else if(err.message==="EXPORT_BUSY")text.textContent="已有导出任务正在进行";
   else text.textContent="导出失败";
   setTimeout(()=>progress.hidden=true,1600);
 }
}
